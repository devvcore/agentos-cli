name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e '.[dev]'
      - run: .venv/bin/pytest -q
      - name: Installer is valid shell
        run: sh -n install.sh
      - name: Built wheel installs and carries the skills
        run: |
          uv build --wheel
          uv tool install --force dist/*.whl
          aos --version
          aos skills list --agentos-only --json | python3 -c "import json,sys; n={s['name'] for s in json.load(sys.stdin)}; assert 'aos' in n and 'agentos-setup' in n, n"
