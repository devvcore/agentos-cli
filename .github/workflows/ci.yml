name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet uv && uv venv --python ${{ matrix.python }} && uv pip install -e '.[dev]'
      - run: .venv/bin/pytest -q
      - name: Installer is valid shell
        run: sh -n install.sh
      - name: Installer runs with /bin/sh in a UTF-8 locale and in C
        # macOS /bin/sh is bash 3.2: in a UTF-8 locale it reads a non-ASCII
        # character right after $NAME as part of the name (Nov 2026 bug).
        run: |
          for loc in en_US.UTF-8 C; do
            home="$(mktemp -d)"
            env -i HOME="$home" PATH=/usr/bin:/bin TERM=dumb LC_ALL="$loc" AOS_NO_MODIFY_PATH=1 /bin/sh ./install.sh
            "$home/.local/bin/aos" --version
          done
      - name: Built wheel installs and carries the skills
        run: |
          uv build --wheel
          uv tool install --force dist/*.whl
          aos --version
          aos skills list --agentos-only --json | python3 -c "import json,sys; n={s['name'] for s in json.load(sys.stdin)}; assert 'aos' in n and 'agentos-setup' in n, n"
