[project]
name = "agentos-cli"
version = "0.2.0"
description = "aos: the AgentOS CLI. Sign in, set up your coding agents, install skills, and work in AgentOS from the terminal."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "Devcore" }]
keywords = ["agentos", "cli", "mcp", "agents", "skills", "claude-code", "codex"]
dependencies = [
  "rich>=13.7",
  "questionary>=2.0",
  "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://tryagentos.net"
Source = "https://github.com/devvcore/agentos-cli"

[project.scripts]
aos = "agentos_cli.cli:main"
agentos = "agentos_cli.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos_cli"]

# The skills live at the repo root (for the Claude Code plugin and skills
# installers) and ship inside the package for `aos setup` / `aos skills`.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "agentos_cli/skills"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "README.md", "LICENSE", "install.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
